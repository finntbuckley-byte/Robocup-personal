; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The VS Code build/upload buttons use this: the full robot. Other envs are
; picked from the env selector in the status bar, or with `-e <name>`.
[platformio]
default_envs = nav

; settings shared by every env - the Serial Monitor button (plug icon) shows
; what you type and sends Enter as a newline, for the bench-test commands
[env]
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; (the old [env:teensy40] / main.cpp collection test was retired 2026-09-27 -
; servotest runs the same crane cycle with live tuning)

; ---------------------------------------------------------------------------
;  nav - THE FULL ROBOT (default env): 4-ToF chain + SEN0628 + side IR +
;  funnel sorting + crane pickup + round timer.
;
;      pio run -e nav -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:nav]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
; course docs: start at 150 MHz, raise once everything is proven
board_build.f_cpu = 150000000L
build_flags = -DNAV_BUILD
build_src_filter =
    +<nav_main.cpp>
    +<navigation.cpp>
    +<tof.cpp>
    +<x8.cpp>
    +<round.cpp>
    +<ir_sensors.cpp>
    +<funnel_sensor.cpp>
    +<weight_detect.cpp>
    +<drive.cpp>
    +<motor.cpp>
    +<collection.cpp>
    +<smooth_servo.cpp>
    +<gate.cpp>
    +<odometry.cpp>
    +<pose.cpp>
    +<imu.cpp>
lib_deps =
    pololu/VL53L1X
    pololu/VL53L0X
    https://github.com/DFRobot/DFRobot_MatrixLidar.git
    https://github.com/cesarvandevelde/HerkulexServo.git
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

; ---------------------------------------------------------------------------
;  enctest - drive-encoder bring-up: which pin is which track, count signs,
;  and ENC_COUNTS_PER_M (drive a marked 1 m). See encoder_test.cpp.
;
;      pio run -e enctest -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:imutest]
platform = teensy
board = teensy40
framework = arduino
board_build.f_cpu = 150000000L
build_flags = -DIMU_TEST
build_src_filter = +<imu_test.cpp>
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

; ---------------------------------------------------------------------------
;  imutest above - BNO055 bring-up: finds it on Wire/Wire1, IMUPLUS heading,
;  sign check by turning the robot by hand. See imu_test.cpp. Drives nothing.
;
;      pio run -e imutest -t upload
; ---------------------------------------------------------------------------
[env:enctest]
platform = teensy
board = teensy40
framework = arduino
board_build.f_cpu = 150000000L
build_flags = -DENC_TEST
build_src_filter = +<encoder_test.cpp> +<drive.cpp> +<motor.cpp> +<imu.cpp>
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

; ---------------------------------------------------------------------------
;  servotest - crane bench test: runs collection.cpp, angles/speeds live-tunable.
;
;      pio run -e servotest -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:servotest]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DSERVO_TEST
; the REAL crane FSM - no copied timings
build_src_filter = +<servo_test.cpp> +<collection.cpp> +<smooth_servo.cpp>

; (pickuptest / src/pickup_hold_test.cpp retired 2026-09-28 - 3rd-target
; hold-at-rest confirmed on the bench. See config.h MAGNET_HOLD_PCT and
; collection.cpp's COLLECTION_HOLD state.)

; ---------------------------------------------------------------------------
;  wirefind - "what's plugged in where" bring-up. Drives no actuators.
;
;      pio run -e wirefind -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:wirefind]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DWIRE_FIND
build_src_filter = +<wire_finder.cpp>
lib_deps =
    pololu/VL53L1X
    pololu/VL53L0X

; ---------------------------------------------------------------------------
;  notchtest - isolated notch-ToF / inductive back-away bench test.
;  Motors stay stopped until 'a'; 'x' is an immediate hard stop/disarm.
;  See src/notch_backaway_test.cpp. This does not build the nav FSM or crane.
;
;      pio run -e notchtest -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:notchtest]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 150000000L
build_src_filter =
    +<notch_backaway_test.cpp>
    +<tof.cpp>
    +<x8.cpp>
    +<drive.cpp>
    +<motor.cpp>
lib_deps =
    pololu/VL53L1X
    pololu/VL53L0X
    https://github.com/DFRobot/DFRobot_MatrixLidar.git

; (magnettest / src/magnet_test.cpp retired 2026-09-28 - PWM hold-level bench
; test done, 50% confirmed by a shake test. See config.h MAGNET_HOLD_PCT and
; collection.cpp's COLLECTION_HOLD state.)

; ---------------------------------------------------------------------------
;  navtest - drive/navigation bring-up rig.
;
;  Builds ONLY nav_test.cpp + motor.cpp, so it doesn't collide with main.cpp,
;  simple_main.cpp and imu.cpp (all three define setup()/loop(), which is why
;  a plain `pio run` can't link right now).
;
;      pio run -e navtest -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------

; [env:navtest]
; platform = teensy
; board = teensy40
; framework = arduino
; monitor_speed = 115200

; build_src_filter =
;     +<nav_test.cpp>
;     +<motor.cpp>

; lib_deps =
;     pololu/VL53L1X
;     pololu/VL53L0X
;     sparkfun/SX1509 IO Expander
;     adafruit/Adafruit BNO055
;     adafruit/Adafruit Unified Sensor*/
