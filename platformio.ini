; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

lib_deps =
    pololu/VL53L1X
    pololu/VL53L0X
    ;sparkfun/SX1509 IO Expander
    https://github.com/cesarvandevelde/HerkulexServo.git
    ;adafruit/Adafruit BNO055
    ;adafruit/Adafruit Unified Sensor

; the default build is still the partner's collection test (main.cpp) - keep
; the full-navigation units out of it (they belong to [env:nav] below)
build_src_filter =
    +<*>
    -<nav_main.cpp>
    -<navigation.cpp>
    -<tof.cpp>
    -<x8.cpp>
    -<round.cpp>

; ---------------------------------------------------------------------------
;  nav - full navigation build: 4-ToF chain + SEN0628 + side IR + funnel
;  sorting + crane pickup + round timer. main.cpp (collection test) is NOT
;  part of this build.
;
;      pio run -e nav -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:nav]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
; course docs: start at 150 MHz, raise once everything is proven
board_build.f_cpu = 150000000L
build_flags = -DNAV_BUILD
build_src_filter =
    +<nav_main.cpp>
    +<navigation.cpp>
    +<tof.cpp>
    +<x8.cpp>
    +<round.cpp>
    +<ir_sensors.cpp>
    +<funnel_sensor.cpp>
    +<weight_detect.cpp>
    +<drive.cpp>
    +<motor.cpp>
    +<collection.cpp>
lib_deps =
    pololu/VL53L1X
    pololu/VL53L0X
    https://github.com/DFRobot/DFRobot_MatrixLidar.git

; ---------------------------------------------------------------------------
;  servotest - isolated bench test for the collection servo (pin 28).
;
;      pio run -e servotest -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:servotest]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DSERVO_TEST
build_src_filter = +<servo_test.cpp>

; ---------------------------------------------------------------------------
;  wirefind - "what's plugged in where" bring-up. Drives no actuators.
;
;      pio run -e wirefind -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:wirefind]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_flags = -DWIRE_FIND
build_src_filter = +<wire_finder.cpp>
lib_deps =
    pololu/VL53L1X
    pololu/VL53L0X

; ---------------------------------------------------------------------------
;  navtest - drive/navigation bring-up rig.
;
;  Builds ONLY nav_test.cpp + motor.cpp, so it doesn't collide with main.cpp,
;  simple_main.cpp and imu.cpp (all three define setup()/loop(), which is why
;  a plain `pio run` can't link right now).
;
;      pio run -e navtest -t upload
;      pio device monitor -b 115200
; ---------------------------------------------------------------------------

; [env:navtest]
; platform = teensy
; board = teensy40
; framework = arduino
; monitor_speed = 115200

; build_src_filter =
;     +<nav_test.cpp>
;     +<motor.cpp>

; lib_deps =
;     pololu/VL53L1X
;     pololu/VL53L0X
;     sparkfun/SX1509 IO Expander
;     adafruit/Adafruit BNO055
;     adafruit/Adafruit Unified Sensor*/
